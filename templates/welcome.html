<!DOCTYPE html>
<html>
<head>
    <title>QuickRupee Loan Eligibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f5f7fa;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .warning-box {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-left: 5px solid #ff9800;
            border-radius: 8px;
            color: #856404;
            font-size: 15px;
            max-width: 500px;
        }

        .start-btn {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .start-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>QuickRupee Loan Eligibility Checker</h1>

    <p>Check your eligibility in less than one minute.</p>

    <div class="warning-box">
        ⚠️ Please answer all questions using only <strong>Yes</strong> or <strong>No</strong>.
    </div>

    <br>

    <a href="/screening">
        <button class="start-btn">Start Screening</button>
    </a>

</body>
</html>
